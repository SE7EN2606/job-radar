name: Scan jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: job-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner/scanner.py

      - name: Commit refreshed jobs
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "No job changes"
          else
            git commit -m "Refresh scanned jobs"
            git push
          fi
