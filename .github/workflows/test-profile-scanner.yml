name: Test profile scanner
on:
  push:
    paths:
      - "scanner/profile_scan.py"
      - "tests/test_profile_scan.py"
      - ".github/workflows/test-profile-scanner.yml"
  pull_request:
    paths:
      - "scanner/profile_scan.py"
      - "tests/test_profile_scan.py"
      - ".github/workflows/test-profile-scanner.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Syntax and offline relevance tests
        run: |
          python -m py_compile scanner/profile_scan.py
          python -m unittest discover -s tests -p "test_profile_scan.py" -v
