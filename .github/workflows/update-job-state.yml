name: Update job state

on:
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: string
      id:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: job-radar-state-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Update state
        env:
          ACTION_NAME: ${{ inputs.action }}
          JOB_ID: ${{ inputs.id }}
        run: node scripts/update-state.mjs
      - name: Commit state
        run: |
          git config user.name job-radar-bot
          git config user.email job-radar-bot@users.noreply.github.com
          git add data/user-state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update job state"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            sleep $((attempt * 2))
          done
          echo "Unable to persist job state after 5 attempts."
          exit 1
