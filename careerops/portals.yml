# Job Radar profile for the Career Ops scanning engine.
# Engine source is pinned in .github/workflows/scan-careerops.yml.

title_filter:
  positive:
    - "Enterprise Account Manager"
    - "Technical Account Manager"
    - "Account Executive"
    - "Senior Account Executive"
    - "Account Director"
    - "Commercial Account Executive"
    - "IT Sales Executive"
    - "Regional Sales Manager"
    - "Sales Director"
    - "Solutions Sales Specialist"
    - "Business Development Manager"
    - "Business Development Director"
    - "Business Solutions Manager"
    - "Partner Manager"
    - "Alliances Manager"
    - "Channel Account Manager"
    - "Customer Success Director"
    - "Strategic Account Manager"
    - "Key Account Manager"
    - "Global Account Manager"
    - "Account Director"
    - "Customer Success Manager"
    - "Customer Success"
    - "Expansion"
    - "Enterprise Account Executive"
    - "Strategic Account Executive"
    - "Major Account Executive"
    - "Responsable Grands Comptes"
    - "Comptes Stratégiques"
    - "Directeur de Clientèle"
  negative:
    - "Business Development Representative"
    - "Sales Development Representative"
    - "SDR"
    - "BDR"
    - "Junior"

# Keep the scanner broad enough for remote roles but reject countries Greg has
# explicitly excluded from physical work/relocation.
location_filter:
  strict: true
  # Office locations remain selective. Remote country-restricted jobs are
  # discoverable but must be checked for actual Estonia/France eligibility.
  always_allow:
    - "Remote Europe"
    - "Europe Remote"
    - "Remote - Europe"
    - "Remote, Europe"
    - "EMEA Remote"
    - "Remote EMEA"
    - "Remote EU"
    - "EU Remote"
    - "Germany (Remote)"
    - "Germany Remote"
    - "Remote - Germany"
    - "Remote Germany"
    - "Germany - Remote"
  allow:
    - "France"
    - "Paris"
    - "Estonia"
    - "Tallinn"
    - "Sweden"
    - "Stockholm"
    - "Switzerland"
    - "Zurich"
    - "Zürich"
    - "Geneva"
    - "Lausanne"
    - "Romandy"
    - "Milan"
    - "Milano"
    - "Turin"
    - "Torino"
    - "Bologna"
    - "Verona"
    - "Venice"
    - "Venezia"
    - "Prague"
    - "Praha"
    - "Slovenia"
    - "Ljubljana"
    - "Warsaw"
    - "Warszawa"
    - "Portugal"
    - "Lisbon"
    - "Lisboa"
    - "Porto"
    - "Luxembourg"
    - "Monaco"
    - "Remote Europe"
    - "Europe Remote"
    - "Remote - Europe"
    - "Remote, Europe"
    - "EU Remote"
    - "Remote EU"
    - "EMEA Remote"
    - "Remote EMEA"
  block_hard:
    - "United Kingdom"
    - "UK"
    - "England"
    - "London"
    - "United States"
    - "USA"
    - "India"
    - "Japan"
    - "Brazil"
    - "Australia"
    - "Canada"
  block:
    - "Germany"
    - "Austria"
    - "Spain"
    - "Netherlands"
    - "Belgium"
    - "Ireland"
    - "Malta"
    - "Cyprus"
    - "Denmark"
    - "Norway"
    - "Finland"
    - "Slovakia"
  remote_title_fallback: true

max_posting_age_days: 30
preferred_languages: [en, fr]

scan_history:
  dedup_include_location: true
  recheck_after_days: 30

tracked_companies:
  - name: GitLab
    careers_url: https://job-boards.greenhouse.io/gitlab
    provider: greenhouse

  - name: TeamViewer
    careers_url: https://careers.teamviewer.com/jobs
    provider: teamtailor

  - name: Akeneo
    careers_url: https://careers.akeneo.com/jobs
    provider: teamtailor


job_boards:
  - name: Welcome to the Jungle
    provider: wttj
    wttj:
      filters: 'contract_type:full_time'
      queries:
        - "enterprise account manager"
        - "strategic account manager"
        - "key account manager"
        - "account director"
        - "enterprise account executive"
        - "strategic account executive"
        - "customer success manager"
        - "responsable grands comptes"
        - "comptes stratégiques"
        - "directeur de clientèle"
        - "it sales executive"
        - "commercial account executive"
        - "account executive saas"
        - "sales director saas"
        - "business development manager software"
        - "partner manager saas"
        - "enterprise customer success"
        - "sales account manager"
        - "responsable commercial informatique"
      max_hits: 400
    enabled: true
